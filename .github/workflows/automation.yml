name: Repository Automation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Analyze Repository
      run: python scripts/automation/analyze_repo.py

    - name: Generate Diagrams
      run: python scripts/automation/generate_diagrams.py

    - name: Generate README
      run: python scripts/automation/generate_readme.py

    - name: Commit Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/diagrams/ repo_knowledge_graph.json README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Auto-generate architecture diagrams and README" && git push)
