name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx flake8 bandit safety pytest

    - name: Run code linting (flake8)
      run: flake8 app/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run security scan (bandit)
      run: bandit -r app/ scripts/ || true

    - name: Run dependency audit (safety)
      run: safety check || true

    - name: Run smoke test
      run: |
        export PYTHONPATH=.
        python scripts/smoke_test.py
